<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #2b579a;
            color: white;
            padding: 30px 20px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }
        .name {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }
        .reg-number {
            font-size: 18px;
            margin-top: 5px;
        }
        .grades-table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }
        .grades-table th, .grades-table td {
            border: 1px solid #2b579a;
            padding: 10px;
        }
        .grades-table th {
            background-color: #2b579a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="mypic.jpg" alt="Profile Picture" class="profile-pic">
        <div class="name">AHMED HASSAN</div>
        <div class="reg-number">4746-FOC/BSCS/F22</div>
    </div>
    <table class="grades-table">
        <tr>
            <th>Course Name</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Web Engineering</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Computing Networks</td>
            <td>B</td>
        </tr>
        <tr>
            <td>Advance Computer Programming</td>
            <td>C+</td>
        </tr>
        <tr>
            <td>Object Oriented Programming</td>
            <td>B+</td>
        </tr>
    </table>
</body>
</html>
